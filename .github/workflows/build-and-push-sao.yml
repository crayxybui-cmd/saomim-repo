name: Build and Push .sao Package

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-sao:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Otomatik Derleme
        run: |
          echo "Depo içeriği inceleniyor..."
          
          # Sadece Makefile varsa derle
          if [ -f "Makefile" ]; then
            echo "Makefile bulundu, derleniyor..."
            make -j$(nproc)
          else
            echo "Makefile bulunamadı, doğrudan paketlemeye geçiliyor."
          fi

      - name: Bütün Depoyu .sao Paketine Dönüştür
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          VERSION="1.0.$(date +%Y%m%d%H%M)"
          PACKAGE_NAME="${REPO_NAME}-${VERSION}.sao"
          
          echo "Paket adı: $PACKAGE_NAME"

          mkdir -p sao_build_dir
          
          # .git ve gereksiz dosyaları hariç tutup bütün depoyu kopyala
          rsync -av --exclude='.git' --exclude='sao_build_dir' --exclude='*.sao' ./ sao_build_dir/

          # sao.json meta veri dosyası oluştur
          echo "{
            \"name\": \"$REPO_NAME\",
            \"version\": \"$VERSION\",
            \"architecture\": \"x86_64\",
            \"build_commit\": \"${{ github.sha }}\",
            \"build_date\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
          }" > sao_build_dir/sao.json

          # Arşivle ve .sao yap
          tar -czf "$PACKAGE_NAME" -C sao_build_dir .
          
          echo "PACKAGE_FILE=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: .sao Paketini Depoya Geri Push'la
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "saomimOS Bot"
          git config --global user.email "bot@saomimos.local"

          git checkout packages || git checkout --orphan packages
          
          rm -rf *.sao
          mv ../${{ env.PACKAGE_FILE }} ./ || mv ${{ env.PACKAGE_FILE }} ./

          git add *.sao
          git commit -m "Auto-build .sao package for commit ${{ github.sha }}"
          git push origin packages --force
